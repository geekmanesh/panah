name: Branch Name Convention

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  validate:
    name: Validate branch name
    runs-on: ubuntu-latest

    steps:
      - name: Check branch name
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          pattern='^(feature|fix|docs)/[0-9]+/[a-z0-9]+(-[a-z0-9]+)*$'

          if [[ ! "$BRANCH_NAME" =~ $pattern ]]; then
            echo "❌ Invalid branch name: $BRANCH_NAME"
            echo ""
            echo "Expected format:"
            echo "<feature|fix|docs>/<issue-number>/<brief-summary>"
            echo ""
            echo "Examples:"
            echo "  feature/123/add-otp-authentication"
            echo "  fix/23/handle-invalid-token"
            echo "  docs/42/update-api-documentation"
            exit 1
          fi

          echo "✅ Valid branch name: $BRANCH_NAME"
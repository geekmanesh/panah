volumes:
  panah_backend_local_postgres_data: {}
  panah_backend_local_postgres_data_backups: {}

services:
  django: &django
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    image: panah_backend_local_django
    container_name: panah_backend_local_django
    depends_on:
      - postgres
    volumes:
      - /app/.venv
      - .:/app:z
    env_file:
      - path: ./.envs/.local/.django
        required: false
      - path: ./.envs/.local/.postgres
        required: false
    ports:
      - '8000:8000'
    command: /start

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: panah_backend_production_postgres
    container_name: panah_backend_local_postgres
    volumes:
      - panah_backend_local_postgres_data:/var/lib/postgresql/18/docker
      - panah_backend_local_postgres_data_backups:/backups
    env_file:
      - path: ./.envs/.local/.postgres
        required: false

